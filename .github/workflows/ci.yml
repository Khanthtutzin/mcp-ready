name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        os: [ubuntu-latest]
        include:
          # The stdio transport spawns child processes and tokenizes command
          # strings, both of which behave differently on Windows and macOS.
          - node: '22'
            os: windows-latest
          - node: '22'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  quality:
    name: lint, format and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Rule docs are in step with the rule sources
        run: npm run docs:check

  dogfood:
    name: check the fixture servers with the built CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: A compliant server passes
        run: node dist/cli/index.js --stdio "node test/fixtures/servers/stdio-server.mjs modern"

      - name: A legacy server fails with exit code 1
        run: |
          set +e
          node dist/cli/index.js --stdio "node test/fixtures/servers/stdio-server.mjs legacy"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 for a legacy server, got $code"
            exit 1
          fi

      - name: An unreachable server exits 2 without inventing findings
        run: |
          set +e
          node dist/cli/index.js --stdio "node --eval \"process.exit(1)\"" --timeout 2000
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 for an unreachable server, got $code"
            exit 1
          fi

      - name: SARIF output is valid JSON
        run: |
          node dist/cli/index.js --stdio "node test/fixtures/servers/stdio-server.mjs legacy" \
            --format sarif --output out.sarif || true
          node --eval "JSON.parse(require('fs').readFileSync('out.sarif','utf8')); console.log('SARIF parses')"
