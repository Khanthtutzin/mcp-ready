name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Required for npm trusted publishing: the job mints a short-lived OIDC token
  # that npm exchanges for publish rights. Without this the publish falls back
  # to looking for a credential and fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # The npm bundled with the runner's Node 22 predates OIDC support, and
      # the failure mode is unhelpful: it reports missing auth rather than an
      # unsupported client. Pin a version known to speak trusted publishing.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - run: npm ci

      # Never publish something that does not pass its own suite.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # npm rewrites the manifest at publish time more aggressively than at
      # pack time. A `./` prefix on `bin` was silently dropped once, which would
      # have shipped a CLI with no executable. Fail the release instead.
      - name: Manifest must survive npm's publish-time normalisation
        run: |
          if npm publish --dry-run 2>&1 | grep -q "auto-corrected"; then
            echo "::error::npm would rewrite package.json on publish. Run 'npm pkg fix' and commit."
            npm publish --dry-run 2>&1 | grep -A5 "auto-corrected"
            exit 1
          fi
          echo "Manifest is clean."

      # Trusted publishing (OIDC). No NODE_AUTH_TOKEN: authentication is the
      # workflow's own identity, checked against the trusted publisher
      # configured on npm for this package. Provenance is attested
      # automatically, so --provenance is neither needed nor allowed here.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
