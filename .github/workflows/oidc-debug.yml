# Temporary diagnostic. Delete once trusted publishing works.
#
# Replicates exactly what npm does internally (lib/utils/oidc.js): fetch a
# GitHub OIDC token with audience npm:registry.npmjs.org, then POST it to the
# npm token-exchange endpoint. A 200 means the trusted publisher matches this
# repo + workflow. Anything else means it does not, and the body says why.
#
# Never prints either token — only status codes and error messages.
name: OIDC debug

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange an OIDC token with npm
        run: |
          set -uo pipefail
          AUD="npm:registry.npmjs.org"

          echo "1. Requesting an id-token from GitHub (audience: $AUD)"
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}")
          TOKEN=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).value||'')" "$RESP")
          if [ -z "$TOKEN" ]; then echo "   FAILED: GitHub issued no token"; exit 1; fi
          echo "   ok — token issued ($(echo -n "$TOKEN" | wc -c) chars, not shown)"

          echo "   subject claim (identifies the workflow to npm):"
          node -e "
            const p=JSON.parse(Buffer.from(process.argv[1].split('.')[1],'base64').toString());
            console.log('     sub:', p.sub);
            console.log('     repository:', p.repository);
            console.log('     workflow_ref:', p.workflow_ref);
          " "$TOKEN"

          echo
          echo "2. Exchanging it at npm's endpoint for mcp-stateless"
          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/mcp-stateless")

          echo "   HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            node -e "
              const j=require(process.argv[1]);
              console.log('   token returned:', j.token ? 'yes (not shown)' : 'NO');
            " "$BODY"
            echo
            echo "   TRUSTED PUBLISHING IS WORKING."
          else
            echo "   response body (no secret on a failure path):"
            sed 's/^/     /' "$BODY"
            echo
            echo "   Trusted publisher does not match this repo/workflow."
            exit 1
          fi
